<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management SPA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Management</h1>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
            >

            <input
                type="number"
                id="age"
                placeholder="Age"
                required
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
                required
            >

            <button type="submit" id="submitButton">
                Add Student
            </button>

            <button type="button" id="cancelButton" onclick="resetForm()">
                Cancel
            </button>
        </form>

        <h2>Student List</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTableBody"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
